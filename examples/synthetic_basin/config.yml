version: 1
name: synthetic_basin_quickstart
root: ../..

boundary: examples/synthetic_basin/inputs/boundary.geojson
dem: examples/synthetic_basin/inputs/dem.tif
recharge_csv: examples/synthetic_basin/inputs/recharge.csv
transmissivity: examples/synthetic_basin/inputs/transmissivity_m2day.tif
depth_to_bedrock: examples/synthetic_basin/inputs/depth_to_bedrock_m.tif
porosity: examples/synthetic_basin/inputs/specific_yield.tif
wells: examples/synthetic_basin/inputs/wells.geojson
pumping_schedule: examples/synthetic_basin/inputs/pumping_climatology.csv
output_dir: examples/synthetic_basin/outputs

recharge:
  source: csv

groundwater:
  start_date: 2020-01-01
  end_date: 2020-12-31
  target_crs: EPSG:26910
  target_resolution_m: 100.0
  stream_area_threshold_m2: 30000.0
  courant_coefficient: 0.5
  stream_drain_offset_m: 0.0
  additional_aquifer_depth_m: 0.0
  deep_aquifer_hydraulics: preserve_transmissivity
  specific_yield_floor: 0.0
  stream_loss_mode: routed_volume_limited
  stream_limiter_tolerance_m3: 1.0e-6
  stream_limiter_max_iterations: 25

spinup:
  start_date: 2019-01-01
  end_date: 2019-12-31
  pumping: false
  initial_condition: base

pumping:
  enabled: true
  mode: climatology
  source_mode: well_cell
  source_area_threshold_m2: 60000.0
  source_zone_storage_fraction: 0.5
  pumping_storage_fraction: 0.5
  strict_supply: false

outputs:
  snapshot_dates:
    - 2020-12-31
  cross_section_dates:
    - 2020-12-31
  reach_visualizations: false
  dry_season_metrics: false

limits:
  warn_node_count: 2000000
  warn_memory_gb: 8.0
