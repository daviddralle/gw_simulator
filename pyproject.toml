[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-simulator"
version = "0.1.0"
description = "Catchment-scale Dupuit-Boussinesq groundwater pumping and streamflow-depletion workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "David Dralle"},
]
dependencies = [
  "fiona",
  "geopandas",
  "landlab>=2.10.1,<2.11",
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow",
  "pyogrio",
  "pyproj",
  "pyyaml",
  "rasterio",
  "rioxarray",
  "scipy",
  "shapely",
  "tqdm",
  "xarray",
]

[project.optional-dependencies]
earth-engine = ["earthengine-api", "geemap"]
reports = ["reportlab"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/daviddralle/gw_simulator"
Issues = "https://github.com/daviddralle/gw_simulator/issues"

[tool.setuptools.packages.find]
include = ["gw_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
