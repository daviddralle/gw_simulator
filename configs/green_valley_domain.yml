version: 1
name: green_valley_domain_continental_v22a_timeseries_wy2011_2024
root: ..

# Full Green Valley groundwater-model domain (98.48 km2).
boundary: data/GVDB/domainBoundary_greenValley.shp
dem: data/derived/green_valley_domain/dem_3dep_10m.tif
recharge_csv: data/forcing/green_valley_domain/recharge_2000_2024.csv
forcing_cache: data/forcing/green_valley_domain/pml_v22a_prism

# Continental starting parameter set. These source rasters already cover the
# full domain and are aligned to the 50 m groundwater grid at model setup.
transmissivity: data/hydrogeology/continental/transmissivity_continental_m2day.tif
depth_to_bedrock: data/hydrogeology/continental/depth_to_bedrock_continental_m.tif
porosity: data/hydrogeology/continental/specific_yield_continental.tif

# Optional official GLHYMPS/Pelletier alternative retained for a later named
# sensitivity; it is not selected by this configuration.
glhymps_zip: data/external/glhymps2/GLHYMPS.zip
hydrogeology_output_dir: data/derived/green_valley_domain/glhymps2
shangguan_depth_source: data/external/soilgrids2017/clips/green_valley/BDTICM_M_250m_to_50m_cm.tif
pelletier_regolith: data/external/pelletier2016/upland_hill-slope_regolith_thickness.tif
pelletier_sediment: data/external/pelletier2016/upland_valley-bottom_and_lowland_sedimentary_deposit_thickness.tif
pelletier_land_cover: data/external/pelletier2016/land_cover_mask.tif
legacy_transmissivity: data/GLYMPHS/transmissivity_m2d.tif
legacy_depth_to_bedrock: data/GLYMPHS/depthToBedrock_m.tif
legacy_porosity: data/GLYMPHS/storativity.tif

wells: data/well_locations.gpkg
pumping_schedule: data/GVDB/pumpingSchedule_50yr.csv
output_dir: runs/green_valley_domain/continental_v22a_timeseries_wy2011_2024/groundwater

earth_engine:
  project: ee-daviddralle

dem_extraction:
  scale_m: 10.0

recharge:
  start_year: 2000
  end_year: 2024
  initial_deficit_mm: 0.0

groundwater:
  start_date: 2010-10-01
  end_date: 2024-09-30
  target_crs: EPSG:26910
  target_resolution_m: 50.0
  stream_area_threshold_m2: 250000.0
  courant_coefficient: 0.5
  stream_drain_offset_m: 0.0
  additional_aquifer_depth_m: 0.0
  deep_aquifer_hydraulics: preserve_transmissivity
  specific_yield_floor: 0.0
  stream_loss_mode: routed_volume_limited
  stream_limiter_tolerance_m3: 1.0e-6
  stream_limiter_max_iterations: 25

spinup:
  start_date: 2008-10-01
  end_date: 2010-09-30
  pumping: false
  initial_condition: base

pumping:
  enabled: true
  # The supplied 50-year file repeats the dated 2009-2019 sequence every ten
  # years. Timeseries mode retains its observed interannual pattern.
  mode: timeseries
  source_mode: topographic
  source_area_threshold_m2: 500000.0
  source_zone_storage_fraction: 0.5
  pumping_storage_fraction: 0.5
  strict_supply: false

outputs:
  snapshot_dates:
    - 2019-09-30
    - 2024-09-30
  cross_section_dates:
    - 2019-09-30
    - 2024-09-30
  reach_fraction_rolling_days: 30
  reach_video_frame_step_days: 7
  reach_video_frames_per_second: 6

limits:
  warn_node_count: 2000000
  warn_memory_gb: 8.0
