version: 1
name: green_valley_sonoma_county_hydrogeology_smoke
root: ..

# This is a deliberately short solver/dry-cell smoke test. The countywide
# Sonoma S and T rasters are sensitivity inputs; they do not replace the
# GLHYMPS/Pelletier baseline in green_valley.yml.
boundary: data/comid_8273277.gpkg
dem: examples/green_valley/outputs/dem.tif
recharge_csv: runs/green_valley/glhymps2_pelletier_v22a_climatology_wy2011_2024/inputs/recharge.csv

transmissivity: data/hydrogeology/sonoma_county/transmissivity_sonoma_county_m2day.tif
porosity: data/hydrogeology/sonoma_county/specific_yield_sonoma_county.tif

# Hold depth fixed at the current baseline so this test isolates the new S/T pair.
depth_to_bedrock: data/derived/green_valley/glhymps2/depth_to_unweathered_bedrock_pelletier2016_m.tif

wells: data/well_locations.gpkg
pumping_schedule: data/GVDB/pumpingSchedule.csv
output_dir: runs/green_valley/sonoma_county_st_smoke/groundwater

groundwater:
  start_date: 2019-02-24
  end_date: 2019-02-26
  target_crs: EPSG:26910
  target_resolution_m: 100.0
  stream_area_threshold_m2: 250000.0
  courant_coefficient: 0.5
  stream_drain_offset_m: 0.0
  additional_aquifer_depth_m: 0.0
  deep_aquifer_hydraulics: preserve_transmissivity
  specific_yield_floor: 0.0

# Omitting spinup intentionally initializes the smoke test at the aquifer base,
# which exercises initially dry cells when recharge and pumping are applied.
pumping:
  enabled: true
  mode: climatology
  source_mode: topographic
  source_area_threshold_m2: 500000.0
  source_zone_storage_fraction: 0.5
  pumping_storage_fraction: 0.5
  strict_supply: false

outputs:
  snapshot_dates:
    - 2019-02-26
  cross_section_dates: []

limits:
  warn_node_count: 2000000
  warn_memory_gb: 8.0
